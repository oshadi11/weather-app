<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="navbar">
        <div class="nav-left">
            <h2 class="logo">Weather<span>App</span></h2>
        </div>
        <div class="nav-right">
            <h2 class="live-weather"><span class="status-dot"></span>LIVE WEATHER</h2>
        </div>
    </div>
    <div class="row">
        <div class="col align">
            <h2 class="small-txt">WEATHER CORNER</h2>
            <h2 class="title">HOW'S THE <br>WEATHER TODAY?</h2>
        </div>
        <div class="col card p-10">
            <h2 class="small-txt color-gray">CURRENT WEATHER</h2>
            <h1 class="temp ">32&deg;C</h1>
            <h1 class="address">Colombo</h1>
            <h1 class="address">western province, Sri lanka</h1>
            <h3 class="dateTxt color-gray">Monday, 2 November</h3>
        </div>
    </div>
</body>

</html>
